# Source gates decide the runner matrix without installing anything. The full
# job shares one Lean build with the formatter and always executes every suite.
# Branches/PRs reuse content-checked artifacts; scheduled, manual and tag runs
# start clean. macOS cadence and its measured cost are recorded in SCRATCHPAD.md.
# Ratchets live only in tests/gates.sh; suite counts only in tests/e2e.sh.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Formatter source is independent of Lean; compile it with our toolchain.
  LEAN_FMT_REV: 9e8704afb1ed88a935cbdbf10d735e826b0034b8

jobs:
  gates:
    name: source gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.runners.outputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # The scheduled runner decision reads recent history.
      - run: sh tests/gates.sh
      - name: select runners
        id: runners
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          os="$(sh tests/ci-runners.sh "$EVENT" "$REF")"
          printf 'os=%s\n' "$os" >> "$GITHUB_OUTPUT"

  e2e:
    name: full gate (${{ matrix.os }})
    needs: gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gates.outputs.os) }}
    steps:
      - uses: actions/checkout@v7

      - name: install test dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            packages=()
            command -v fish >/dev/null || packages+=(fish)
            command -v clang >/dev/null || packages+=(clang)
            if [ "${#packages[@]}" -gt 0 ]; then
              # Hosted images already carry indexes; refresh only if stale.
              if ! sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
              fi
            fi
            test -x /usr/bin/ar
          elif ! command -v fish >/dev/null; then
            brew install fish
          fi

      - name: cache Lean toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: install pinned Lean
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '[:space:]' < lean-toolchain)"
          elan show

      # Reuse across source edits, never across compilers or build configurations.
      # Lake rehashes inputs; the formatter checks source and dependency identity.
      # No restore on schedule/dispatch/tags keeps a regular clean verification.
      - name: cache build and formatter analysis
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        uses: actions/cache@v6
        with:
          path: |
            .lake/build
            .lean-fmt-cache
          key: verify-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            verify-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake', 'lakefile.lean', 'lake-manifest.json') }}-

      # Hygiene runs once on Linux; macOS covers the platform-dependent verifier.
      - name: cache standalone formatter
        if: runner.os == 'Linux'
        id: fmt-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/lean-fmt
          key: lean-fmt-${{ runner.os }}-${{ runner.arch }}-${{ env.LEAN_FMT_REV }}-${{ hashFiles('lean-toolchain') }}
      - name: install and verify standalone formatter
        if: runner.os == 'Linux'
        env:
          FMT_CACHE_HIT: ${{ steps.fmt-cache.outputs.cache-hit }}
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          toolchain="$(tr -d '[:space:]' < lean-toolchain)"
          case "$toolchain" in
            leanprover/lean4:v*) ;;
            *) echo "::error::unexpected Lean toolchain: $toolchain"; exit 1 ;;
          esac
          if [ "$FMT_CACHE_HIT" != true ]; then
            fmt_src="$(mktemp -d "$RUNNER_TEMP/lean-fmt.XXXXXX")"
            git -C "$fmt_src" init --quiet
            git -C "$fmt_src" fetch --quiet --depth 1 \
              https://github.com/jcreinhold/lean-fmt.git "$LEAN_FMT_REV"
            git -C "$fmt_src" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$fmt_src" rev-parse HEAD)" = "$LEAN_FMT_REV"
            cp lean-toolchain lake "$fmt_src/"
            (
              cd "$fmt_src" || exit 1
              ELAN_TOOLCHAIN="$toolchain" ./lake build lean-fmt artifactExtractor
            )
            make -C "$fmt_src" -o build install
          fi
          fmt_version="$("$HOME/.local/bin/lean-fmt" --version)"
          printf '%s\n' "$fmt_version"
          case "$fmt_version" in
            "lean-fmt "*" (Lean ${toolchain#leanprover/lean4:v})") ;;
            *) echo "::error::lean-fmt compiler mismatch: $fmt_version; expected $toolchain"; exit 1 ;;
          esac

      - name: full gate
        run: ./tests/e2e.sh

      # Lint after the build: semantic checks can use its existing Lean artifacts.
      # Layout is already checked by tests/e2e.sh, so it needs no second invocation.
      - uses: actions/setup-python@v7
        if: runner.os == 'Linux'
        id: python
        with:
          python-version: '3.x'
      - name: cache pre-commit environments
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: commit hygiene and semantic lint
        if: runner.os == 'Linux'
        run: |
          python -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: logs on failure
        if: failure()
        run: |
          for f in /tmp/linger-*.log /tmp/linger-*.out; do
            [ -f "$f" ] || continue
            printf '\n===== %s =====\n' "$f"
            tail -100 "$f"
          done
