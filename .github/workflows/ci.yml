# Source hygiene runs before compilation. The full verifier retains every
# check; only a prior successful verification of identical inputs may replace it.
# scripts/ci-inputs.sh hashes paths, modes, content AND runner OS/arch/image version.
# Source gates run even when verification is reused.
# Schedule, dispatch and tags verify cleanly; scripts/ci-runners.sh chooses macOS.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Weekly: scripts/ci-runners.sh's 8-day WINDOW must cover this period; change them together.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELAN_VERSION: v4.2.4
  LEAN_FMT_REV: 9e8704afb1ed88a935cbdbf10d735e826b0034b8
  PRE_COMMIT_VERSION: 4.6.0

jobs:
  gates:
    name: hygiene and verification inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.inputs.outputs.os }}
      key: ${{ steps.inputs.outputs.key }}
      verified: ${{ steps.verified.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # The scheduled runner decision reads recent history.
      - name: source hygiene
        run: sh scripts/hygiene.sh
      - name: validate workflow
        run: |
          curl -sSfL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes=''
      - name: identify verification inputs and runners
        id: inputs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          test -n "$ImageVersion"
          key="$(sh scripts/ci-inputs.sh)"
          os="$(sh scripts/ci-runners.sh "$EVENT" "$REF")"
          printf 'key=%s\nos=%s\n' "$key" "$os" >> "$GITHUB_OUTPUT"
      - name: look up successful verification
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        id: verified
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/linger-verified
          key: passed-v1-${{ steps.inputs.outputs.key }}
      - name: check source gates and report reused verification
        if: steps.verified.outputs.cache-hit == 'true'
        run: |
          sh scripts/gates.sh
          cat "$RUNNER_TEMP/linger-verified" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: verify (${{ matrix.os }})
    needs: gates
    if: needs.gates.outputs.verified != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gates.outputs.os) }}
    steps:
      - uses: actions/checkout@v7

      - name: install test dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            packages=()
            command -v fish >/dev/null || packages+=(fish)
            command -v clang >/dev/null || packages+=(clang)
            if [ "${#packages[@]}" -gt 0 ]; then
              # Hosted images already carry indexes; refresh only if stale.
              if ! sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
              fi
            fi
            test -x /usr/bin/ar
          elif ! command -v fish >/dev/null; then
            brew install fish
          fi

      - name: install pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/pre-commit"
          "$RUNNER_TEMP/pre-commit/bin/pip" install "pre-commit==$PRE_COMMIT_VERSION"
          echo "$RUNNER_TEMP/pre-commit/bin" >> "$GITHUB_PATH"

      - name: cache Lean toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ env.ELAN_VERSION }}-${{ hashFiles('lean-toolchain') }}
      - name: install pinned Lean
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            case "$RUNNER_OS-$RUNNER_ARCH" in
              Linux-X64) asset=elan-x86_64-unknown-linux-gnu sum=42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 ;;
              macOS-ARM64) asset=elan-aarch64-apple-darwin sum=7ad829861392c718dfebde3a83b5c8508df47be02af68894b094b0b3952616e5 ;;
              *) echo "::error::no pinned elan for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
            esac
            curl -sSfL --retry 3 "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/$asset.tar.gz" -o "$RUNNER_TEMP/elan.tar.gz"
            printf '%s  %s\n' "$sum" "$RUNNER_TEMP/elan.tar.gz" | shasum -a 256 --check
            tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '[:space:]' < lean-toolchain)"
          elan show

      - name: cache checked build artifacts
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        uses: actions/cache@v6
        with:
          path: |
            .lake/build
            .lean-fmt-cache
          key: verify-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake', 'lakefile.lean', 'lake-manifest.json') }}-${{ needs.gates.outputs.key }}
          restore-keys: |
            verify-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: cache standalone formatter
        if: runner.os == 'Linux'
        id: fmt-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/lean-fmt
          key: lean-fmt-${{ runner.os }}-${{ runner.arch }}-${{ env.LEAN_FMT_REV }}-${{ hashFiles('lean-toolchain') }}
      - name: install and verify standalone formatter
        if: runner.os == 'Linux'
        env:
          FMT_CACHE_HIT: ${{ steps.fmt-cache.outputs.cache-hit }}
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          toolchain="$(tr -d '[:space:]' < lean-toolchain)"
          case "$toolchain" in
            leanprover/lean4:v*) ;;
            *) echo "::error::unexpected Lean toolchain: $toolchain"; exit 1 ;;
          esac
          if [ "$FMT_CACHE_HIT" != true ]; then
            fmt_src="$(mktemp -d "$RUNNER_TEMP/lean-fmt.XXXXXX")"
            git -C "$fmt_src" init --quiet
            git -C "$fmt_src" fetch --quiet --depth 1 \
              https://github.com/jcreinhold/lean-fmt.git "$LEAN_FMT_REV"
            git -C "$fmt_src" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$fmt_src" rev-parse HEAD)" = "$LEAN_FMT_REV"
            cp lean-toolchain lake "$fmt_src/"
            (
              cd "$fmt_src" || exit 1
              ELAN_TOOLCHAIN="$toolchain" ./lake build lean-fmt artifactExtractor
            )
            make -C "$fmt_src" -o build install
          fi
          fmt_version="$("$HOME/.local/bin/lean-fmt" --version)"
          printf '%s\n' "$fmt_version"
          case "$fmt_version" in
            "lean-fmt "*" (Lean ${toolchain#leanprover/lean4:v})") ;;
            *) echo "::error::lean-fmt compiler mismatch: $fmt_version; expected $toolchain"; exit 1 ;;
          esac

      - name: full verification
        run: ./lake test

      # No always() or failure() here: a receipt exists only after the complete
      # verifier succeeds. Recompute its image-aware key on this actual runner.
      - name: record successful verification
        if: success() && runner.os == 'Linux' && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')))
        id: receipt
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          key="$(sh scripts/ci-inputs.sh)"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
          printf 'Reused [successful verification](%s) for unchanged inputs `%s`. Source gates and hygiene ran again.\n' "$RUN_URL" "$key" > "$RUNNER_TEMP/linger-verified"
      - name: save successful verification
        if: success() && steps.receipt.outputs.key != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/linger-verified
          key: passed-v1-${{ steps.receipt.outputs.key }}

      - name: logs on failure
        if: failure()
        run: |
          for f in /tmp/linger-verify.*/* /tmp/linger-*.log /tmp/linger-*.out; do
            [ -f "$f" ] || continue
            printf '\n===== %s =====\n' "$f"
            tail -100 "$f"
          done
