# CI — two tiers, on someone else's machine.
#
#   gates  (fast, ubuntu)   what .pre-commit-config.yaml runs locally, plus the
#                           proofs elaborating. Blocks the rest.
#   e2e    (slow, matrix)   ./tests/e2e.sh, the whole gate — clean rebuild, shim
#                           smoke tests, ten pty suites. THIS is where the slow
#                           work lives; no local hook runs it.
#
# The local hook is deliberately cheap (about a second, no Lean compiled), so CI is
# not a net here — it is where the build and the suites actually run. It is also the
# only place the macOS half of AGENTS.md's "builds and passes on Linux and macOS"
# is ever checked.
#
# NO RATCHET NUMBER APPEARS IN THIS FILE. SHIM_CAP, HEARTBEAT_CAP,
# RUNTIME_PARTIAL_CAP, E2E_PARTIAL_CAP and the ten per-suite check-count floors
# live in tests/gates.sh and tests/e2e.sh, and this workflow calls those scripts.
# A cap that can disagree between CI and the hook is worse than no CI, which is
# the reason tests/gates.sh was split out in the first place (see its header).

name: ci

on:
  push:
  pull_request:

# Two pushes to the same branch: the older run is wasted work. Built-in, not an
# action.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Tier 1 — the millisecond checks plus "does it elaborate". Mirrors pre-commit.
  # ───────────────────────────────────────────────────────────────────────────
  gates:
    name: gates + proofs (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # fetch-depth 1 is enough: tests/gates.sh uses `git grep` (working tree,
        # no rev) and `git ls-files` (the index). Neither reads history.

      # FIRST, because it needs nothing but git: no toolchain, no python, no network.
      # The fastest possible failure for a `sorry`, a raised ratchet, or a stray .py.
      # pre-commit runs this same script again later; that is deliberate duplication of
      # a millisecond check, so the cheap signal does not wait on the expensive setup.
      - name: source-tree gates (purity, the OS surface, every ratchet)
        run: sh tests/gates.sh

      # WHY `./lake` AND NOT BARE `lake`, ON A RUNNER THE WRAPPER WAS NOT WRITTEN
      # FOR. AGENTS.md says always `./lake`; the wrapper's Linux branch exists
      # because the AL2 dev host has glibc 2.26 and cannot run the toolchain's
      # bundled clang. A GitHub ubuntu runner has neither that problem nor
      # Homebrew. Tracing the wrapper's own four Linux-branch lines here:
      #
      #   PATH=/home/linuxbrew/.linuxbrew/bin:$PATH   dir absent -> inert
      #   LEAN_CC=clang                               needs a clang on PATH  <-- the only real requirement
      #   LEAN_AR=/usr/bin/ar                         binutils, preinstalled
      #   LIBRARY_PATH=$HOME/.elan/toolchains/<derived from lean-toolchain>/lib
      #                                               correct once elan installs
      #                                               the pinned toolchain
      #
      # So it degrades gracefully, and the preflight below turns its two
      # unstated preconditions into loud failures instead of a confusing C-backend
      # error. NO DEVIATION FROM `./lake` IS NEEDED — and none was possible
      # anyway: tests/e2e.sh calls `./lake` itself, so the e2e job could not have
      # used bare `lake` without editing the gate.
      - name: preflight — the ./lake wrapper's Linux-branch preconditions
        run: |
          # LEAN_CC=clang: present on the ubuntu images, but assert it rather
          # than assume it, and install it if a future image drops it.
          # (`A || B && C` is left-associative in sh, so this is an if, not a ||.)
          if ! command -v clang >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang
          fi
          clang --version | head -1
          # LEAN_AR=/usr/bin/ar
          test -x /usr/bin/ar || { echo "::error::/usr/bin/ar missing; ./lake sets LEAN_AR to it"; exit 1; }
          # The wrapper derives its toolchain directory from lean-toolchain and
          # exits with the path it computed if that directory is missing, so the
          # drift this step used to check for is now impossible. Left as a note
          # rather than a check: asserting a coupling that was removed is how a
          # gate starts lying.

      # The toolchain is the one big download and it is untouched by the gate, so
      # this is the cache that actually pays. Keyed on lean-toolchain: a version
      # bump is a new key, which is exactly right.
      - name: cache elan + toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      # Plain curl over a third-party action for two reasons. (1) A marketplace
      # Lean action wraps `lake` — this repo's build command is deliberately
      # `./lake`, the wrapper, so an action that called `lake` for us would
      # bypass the thing AGENTS.md names as the invariant. (2) One less
      # unreviewed dependency in the trust path. The toolchain VERSION is pinned
      # by lean-toolchain and elan reads it, so elan's own version only affects
      # the installer; downloaded to a file rather than curl|sh so a fetch
      # failure is distinguishable from a script failure.
      - name: install elan (pinned toolchain from lean-toolchain)
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '[:space:]' < lean-toolchain)"
          elan show

      # AFTER elan, and that ordering is the whole point: `make install` builds lean-fmt
      # with `lake`, so a lean-fmt step placed before the toolchain fails with a missing
      # `lake`. It was placed before, and it did.
      # Commit-time hygiene, for a clone that never ran `pre-commit install`. Same
      # config, same `tests/gates.sh`, so CI and the hook cannot disagree. First
      # because it is the cheapest thing that can fail.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # lean-fmt BEFORE pre-commit, because the pre-commit hook skips its lean-fmt
      # step with a note when the binary is absent — right for a fresh clone, wrong
      # for CI, where a silent skip is exactly the thing that lets a finding through.
      # Installing it here means the hook's step actually runs.
      #
      # Standalone `make install`, never a Lake `require`: the require-free lakefile
      # and the empty lake-manifest are gates in tests/gates.sh, and README promises
      # no external Lean dependencies. lean-fmt supports this explicitly.
      #
      # The tag must equal lean-toolchain: lean-fmt ships one release per toolchain.
      # Read it rather than hardcoding it, so a future bump fails loudly at the clone
      # instead of building a mismatched formatter.
      - name: install lean-fmt (standalone, tag == lean-toolchain)
        run: |
          # The tag is the toolchain string after the `leanprover/lean4:` prefix, and
          # it ALREADY carries the leading `v` — lean-toolchain reads
          # `leanprover/lean4:v4.34.0-rc2`. Prefixing another `v` here asked for
          # `vv4.34.0-rc2` and failed two runs; the tag is used verbatim now, and the
          # assertion below is what makes a mistake like that loud rather than a
          # confusing clone error.
          tag="$(sed -n 's|^leanprover/lean4:||p' lean-toolchain | tr -d '[:space:]')"
          case "$tag" in
            v*) ;;
            *)  echo "::error::lean-toolchain gave '$tag', which does not start with v; lean-fmt tags are the toolchain string verbatim"; exit 1 ;;
          esac
          git clone --quiet --branch "$tag" --depth 1 \
            https://github.com/jcreinhold/lean-fmt.git /tmp/lean-fmt \
            || { echo "::error::lean-fmt has no tag $tag; it ships one release per toolchain, so a bump needs a matching lean-fmt release"; exit 1; }
          make -C /tmp/lean-fmt install
          # PREFIX defaults to $HOME/.local, which is not on a runner's PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/lean-fmt" --version

      - name: pre-commit (hygiene, source-tree gates, lean-fmt check)
        run: |
          python -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure

      # Worth caching HERE and nowhere else: this job builds incrementally,
      # exactly as pre-commit does. The e2e job deliberately has no such cache —
      # see the note on that job. Keyed on the toolchain plus every input lake
      # traces; restore-keys let a source change reuse the previous build rather
      # than start cold. A stale restore cannot mask a failure in the
      # authoritative signal, because the e2e job rebuilds from empty.
      # To bust it by hand, bump `v1`.
      - name: cache .lake/build (incremental, this job only)
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: lake-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'c/shim.c', '*.lean', 'Linger/**/*.lean', 'Theorems/**/*.lean', 'Tests/**/*.lean', 'E2E/**/*.lean') }}
          restore-keys: |
            lake-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      # `warningAsError := true` in lakefile.lean's leanOptions already makes a
      # warning an error AT THE DECLARATION (and the shim target passes
      # -Wall -Werror to clang), so this step does not need to police
      # declaration warnings — verified by reading the lakefile, not assumed.
      # The log grep covers the residue that option cannot: a warning lake
      # itself emits, which is not attached to any declaration. It is the same
      # two lines tests/e2e.sh step 1 runs, so CI and the gate cannot diverge on
      # what "warning-clean" means.
      - name: build — core, proofs, unit tests (warning-clean)
        run: |
          ./lake build Linger Theorems Tests > /tmp/linger-ci-build.log 2>&1 || {
            tail -40 /tmp/linger-ci-build.log; exit 1;
          }
          if grep -qE '^(warning|error)' /tmp/linger-ci-build.log; then
            grep -E '^(warning|error)' /tmp/linger-ci-build.log
            echo "::error::build is not warning-clean"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Tier 2 — the whole gate. Mirrors pre-push.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: full gate (${{ matrix.os }})
    needs: gates            # don't spend a pty matrix on a tree with a `sorry`
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45     # a pty regression can hang: `pump` is unbounded by
                            # design (THEOREMS.md §Total). Fail, don't idle.
    strategy:
      fail-fast: false      # a Linux failure must not hide a macOS-only one:
                            # the platform splits are the reason macos is here.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: preflight — the ./lake wrapper's Linux-branch preconditions
        if: runner.os == 'Linux'   # ./lake is a pass-through on Darwin, on
                                   # purpose: /usr/bin/ar is Apple's ar and
                                   # cannot read lake's @rsp file. Nothing to
                                   # check there.
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang
          fi
          test -x /usr/bin/ar || { echo "::error::/usr/bin/ar missing"; exit 1; }

      - name: cache elan + toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: install elan (pinned toolchain from lean-toolchain)
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '[:space:]' < lean-toolchain)"

      # DELIBERATELY NO .lake/build CACHE ON THIS JOB. tests/e2e.sh step 1 opens
      # with `rm -rf .lake/build` — a restored cache would be deleted before the
      # first compile, so it would cost a download and save nothing. That clean
      # rebuild is the point of the gate (it is what makes "warning-clean" mean
      # every declaration, not just the ones that happened to be stale), so the
      # honest handling is to not pretend to cache it. ~/.elan above is cached;
      # that is the part e2e.sh does not delete.
      - name: full gate — ./tests/e2e.sh
        run: ./tests/e2e.sh

      # e2e.sh tails 25 lines of the failing suite; the rest sits in /tmp. Dump
      # it into the job log rather than adding an artifact-upload action — a pty
      # failure on a machine nobody can attach to is only debuggable from the log.
      - name: logs (on failure)
        if: failure()
        run: |
          for f in /tmp/linger-build.log /tmp/linger-coverage.log /tmp/linger-*.out; do
            [ -f "$f" ] || continue
            printf '\n===== %s =====\n' "$f"
            tail -100 "$f"
          done
