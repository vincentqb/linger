# CI — two tiers, on someone else's machine.
#
#   gates  (fast, ubuntu)   what .pre-commit-config.yaml runs locally, plus the
#                           layout half of lean-fmt. Compiles NOTHING. Blocks the
#                           rest.
#   e2e    (slow)           ./tests/e2e.sh, the whole gate — clean rebuild, shim
#                           smoke tests, ten pty suites. THIS is where the slow
#                           work lives; no local hook runs it. ubuntu on every
#                           push; macOS on a schedule, a tag, or by hand.
#
# The local hook is deliberately cheap (about a second, no Lean compiled), so CI is
# not a net here — it is where the build and the suites actually run. It is also the
# only place the macOS half of AGENTS.md's "builds and passes on Linux and macOS"
# is ever checked.
#
# WHY macOS IS NOT ON THE PER-PUSH PATH. Measured 2026-09-15, from this repo's own
# run history: a push billed 66-97 minutes, of which macOS was 50-70 — GitHub bills
# a macOS minute at 10x a Linux one and rounds each job up. 36 commits in a month
# exhausted a 2,000-minute private-repo quota. A `paths:` filter was measured first
# and rejected: 7 of 9 commits that day touched `Linger/Posix.lean` or
# `E2E/Harness.lean`, so it would have run macOS seven times anyway, while only 1 of
# 37 commits that month touched `c/shim.c` — where the `#ifdef __APPLE__` split
# actually lives. So the honest lever is cadence, not paths. A macOS-only regression
# now surfaces within a week, on a tag, or on demand, instead of within a push.
#
# NO RATCHET NUMBER APPEARS IN THIS FILE. Source ratchets live in
# tests/gates.sh; exact suite check counts live in tests/e2e.sh. This workflow
# calls those scripts so CI cannot disagree with their numbers.

name: ci

on:
  # Branch-scoped on purpose: `push` with no filter plus `pull_request` bills a
  # same-repo PR branch TWICE, once for each event. Work here lands on main, so
  # this costs nothing today and closes the trap.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The macOS half's regular home. Monday 06:17 UTC — off the hour, which GitHub
  # throttles. Note a scheduled workflow is disabled after 60 days of repository
  # inactivity, and only ever runs on the default branch.
  schedule:
    - cron: '17 6 * * 1'
  # …and its on-demand home, for a commit that touches the platform surface
  # (`c/shim.c`, the `./lake` wrapper) before waiting a week to find out.
  workflow_dispatch:

# Two pushes to the same branch: the older run is wasted work. Built-in, not an
# action.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Tier 1 — the millisecond checks plus the layout gate. Mirrors pre-commit.
  # Compiles nothing: the build lives in the e2e job, which rebuilds from empty
  # anyway, so having it here too was paying twice for one signal.
  # ───────────────────────────────────────────────────────────────────────────
  gates:
    name: gates + format (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # fetch-depth 1 is enough: tests/gates.sh uses `git grep` (working tree,
        # no rev) and `git ls-files` (the index). Neither reads history.

      # FIRST, because it needs nothing but git: no toolchain, no python, no network.
      # The fastest possible failure for a `sorry`, a raised ratchet, or a stray .py.
      # pre-commit runs this same script again later; that is deliberate duplication of
      # a millisecond check, so the cheap signal does not wait on the expensive setup.
      - name: source-tree gates (purity, the OS + unsafe surfaces, the Vt friend set, the runtime ties, spec citations, the status glyphs, the ratchets)
        run: sh tests/gates.sh

      # The toolchain is the one big download, and `lean-fmt`'s own build needs
      # `lake` on a cache miss. Keyed on lean-toolchain: a version bump is a new
      # key, which is exactly right.
      - name: cache elan + toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      # Plain curl over a third-party action for two reasons. (1) A marketplace
      # Lean action wraps `lake` — this repo's build command is deliberately
      # `./lake`, the wrapper, so an action that called `lake` for us would
      # bypass the thing AGENTS.md names as the invariant. (2) One less
      # unreviewed dependency in the trust path. The toolchain VERSION is pinned
      # by lean-toolchain and elan reads it, so elan's own version only affects
      # the installer; downloaded to a file rather than curl|sh so a fetch
      # failure is distinguishable from a script failure.
      - name: install elan (pinned toolchain from lean-toolchain)
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '[:space:]' < lean-toolchain)"
          elan show

      # AFTER elan, and that ordering is the whole point: `make install` builds lean-fmt
      # with `lake`, so a lean-fmt step placed before the toolchain fails with a missing
      # `lake`. It was placed before, and it did.
      # Commit-time hygiene, for a clone that never ran `pre-commit install`. Same
      # config, same `tests/gates.sh`, so CI and the hook cannot disagree. First
      # because it is the cheapest thing that can fail.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # lean-fmt BEFORE pre-commit, because the pre-commit hook skips its lean-fmt
      # step with a note when the binary is absent — right for a fresh clone, wrong
      # for CI, where a silent skip is exactly the thing that lets a finding through.
      # Installing it here means the hook's step actually runs.
      #
      # Standalone `make install`, never a Lake `require`: the require-free lakefile
      # and the empty lake-manifest are gates in tests/gates.sh, and README promises
      # no external Lean dependencies. lean-fmt supports this explicitly.
      #
      # The tag must equal lean-toolchain: lean-fmt ships one release per toolchain.
      # Read it rather than hardcoding it, so a future bump fails loudly at the clone
      # instead of building a mismatched formatter.
      # `~/.local/bin/lean-fmt` cached, keyed on lean-toolchain: lean-fmt ships one
      # release per toolchain, so the toolchain string identifies the binary exactly.
      # Without this, every run did `make -C /tmp/lean-fmt install` — a full Lake build
      # of the formatter, which is most of why this job ranges 10-20 min. Restoring a
      # binary cannot weaken a check: it is the same tag the clone below would fetch,
      # and the `--version` assertion still runs.
      - name: cache lean-fmt (one release per toolchain)
        id: fmt-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/lean-fmt
          key: lean-fmt-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: install lean-fmt (standalone, tag == lean-toolchain)
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if [ -x "$HOME/.local/bin/lean-fmt" ]; then
            "$HOME/.local/bin/lean-fmt" --version
            exit 0
          fi
          # The tag is the toolchain string after the `leanprover/lean4:` prefix, and
          # it ALREADY carries the leading `v` — lean-toolchain reads
          # `leanprover/lean4:v4.34.0-rc2`. Prefixing another `v` here asked for
          # `vv4.34.0-rc2` and failed two runs; the tag is used verbatim now, and the
          # assertion below is what makes a mistake like that loud rather than a
          # confusing clone error.
          tag="$(sed -n 's|^leanprover/lean4:||p' lean-toolchain | tr -d '[:space:]')"
          case "$tag" in
            v*) ;;
            *)  echo "::error::lean-toolchain gave '$tag', which does not start with v; lean-fmt tags are the toolchain string verbatim"; exit 1 ;;
          esac
          git clone --quiet --branch "$tag" --depth 1 \
            https://github.com/jcreinhold/lean-fmt.git /tmp/lean-fmt \
            || { echo "::error::lean-fmt has no tag $tag; it ships one release per toolchain, so a bump needs a matching lean-fmt release"; exit 1; }
          make -C /tmp/lean-fmt install
          # PREFIX defaults to $HOME/.local, which is not on a runner's PATH.
          "$HOME/.local/bin/lean-fmt" --version

      - name: pre-commit (hygiene, source-tree gates, lean-fmt check)
        run: |
          python -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure

      # The formatter's drift gate — the layout half of lean-fmt; the linter half ran
      # inside pre-commit above. Not in the commit hook: `format --check` re-renders
      # every file it visits (~22 s warm over the tree), which is CI-tier cost by the
      # two-tier split this file's header describes. Purely syntactic, so it needs no
      # build — which is what lets this whole job compile nothing.
      - name: lean-fmt format --check (layout drift)
        run: lean-fmt format --check

      # NO BUILD STEP, AND NO .lake/build CACHE, ON PURPOSE. This job used to run
      # `./lake build Linger Theorems Tests` and cache the result; the e2e job then
      # rebuilt the same thing from empty inside tests/e2e.sh step 1, because that
      # clean rebuild is what makes "warning-clean" mean every declaration rather
      # than the stale ones. So the compile was billed twice for one signal, and the
      # cache key hashed every .lean file — meaning any Lean commit missed it and
      # paid a cold build here as well. What that step uniquely caught was a `sorry`
      # or a warning ~10 minutes sooner; `tests/gates.sh` above already greps for
      # `sorry` in milliseconds, and with macOS off the per-push path there is no
      # expensive matrix left to protect from a bad tree.

  # ───────────────────────────────────────────────────────────────────────────
  # Tier 2 — the whole gate, and the only place anything compiles.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: full gate (${{ matrix.os }})
    needs: gates            # don't spend the suites on a tree with a `sorry`
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45     # a pty regression can hang: `pump` is unbounded by
                            # design (THEOREMS.md §Total). Fail, don't idle.
                            # Also the blast radius of a hang: 45 macOS minutes
                            # bill as 450.
    strategy:
      fail-fast: false      # a Linux failure must not hide a macOS-only one:
                            # the platform splits are the reason macos is here.
      matrix:
        # ubuntu always; macOS only on the schedule, a tag, or a manual run — see
        # the header for the measurement behind that.
        #
        # `cond && A || B` is GitHub's ternary, and the operands here are non-empty
        # STRINGS with one `fromJSON` around the whole thing, deliberately: the
        # array-valued form (`cond && fromJSON(A) || fromJSON(B)`) leans on a
        # non-empty array being truthy, which is a coercion worth not betting the
        # only compiling job on. A non-empty string is unambiguously truthy.
        # Do not try to build the JSON by concatenation — that is where this idiom
        # actually breaks. actionlint does NOT check this (verified: it exits 0 on a
        # deliberately mistyped version), so the shape is held by a grep in
        # tests/gates.sh instead.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      # E2E.Terminal carries a required interactive-fish regression. Missing the
      # subject is a failed environment, never a counted test pass.
      - name: install fish for the required terminal regression
        run: |
          if command -v fish >/dev/null; then exit 0; fi
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fish
          else
            brew install fish
          fi

      - name: preflight — the ./lake wrapper's Linux-branch preconditions
        if: runner.os == 'Linux'   # ./lake is a pass-through on Darwin, on
                                   # purpose: /usr/bin/ar is Apple's ar and
                                   # cannot read lake's @rsp file. Nothing to
                                   # check there.
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang
          fi
          test -x /usr/bin/ar || { echo "::error::/usr/bin/ar missing"; exit 1; }

      - name: cache elan + toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: install elan (pinned toolchain from lean-toolchain)
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '[:space:]' < lean-toolchain)"

      # DELIBERATELY NO .lake/build CACHE ON THIS JOB. tests/e2e.sh step 1 opens
      # with `rm -rf .lake/build` — a restored cache would be deleted before the
      # first compile, so it would cost a download and save nothing. That clean
      # rebuild is the point of the gate (it is what makes "warning-clean" mean
      # every declaration, not just the ones that happened to be stale), so the
      # honest handling is to not pretend to cache it. ~/.elan above is cached;
      # that is the part e2e.sh does not delete.
      - name: full gate — ./tests/e2e.sh
        run: ./tests/e2e.sh

      # e2e.sh tails 25 lines of the failing suite; the rest sits in /tmp. Dump
      # it into the job log rather than adding an artifact-upload action — a pty
      # failure on a machine nobody can attach to is only debuggable from the log.
      - name: logs (on failure)
        if: failure()
        run: |
          for f in /tmp/linger-build.log /tmp/linger-coverage.log /tmp/linger-*.out; do
            [ -f "$f" ] || continue
            printf '\n===== %s =====\n' "$f"
            tail -100 "$f"
          done
