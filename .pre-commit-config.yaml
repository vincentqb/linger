# Fast commit-time checks only. Builds and format drift run in CI.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      # Tests/ and tests/ deliberately coexist; tests/gates.sh checks their contents.
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: [--maxkb=256]

  - repo: local
    hooks:
      - id: gates
        name: source-tree gates (purity, OS + unsafe surfaces, Vt friend set, runtime ties, spec citations, the ratchets)
        entry: tests/gates.sh
        language: script
        pass_filenames: false
        always_run: true

      # Standalone dev tool, not a Lake dependency. CI installs it, so a fresh
      # clone may skip locally without weakening the authoritative check.
      - id: lean-fmt
        name: lean-fmt check (import hygiene, unused bindings, stray set_options)
        entry: bash -c 'command -v lean-fmt >/dev/null || { echo "lean-fmt not installed; see specs/archive/toolchain-and-fmt.md"; exit 0; }; exec lean-fmt check'
        language: system
        pass_filenames: false
        always_run: true
