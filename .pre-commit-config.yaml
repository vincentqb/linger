minimum_pre_commit_version: '3.2.0'
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: lint
        name: hygiene, gates, formatting and semantic lint
        entry: sh scripts/lint.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
