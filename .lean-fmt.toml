# Formatter and linter are both adopted. Defaults apply except where the code's
# proof shape or import contract requires otherwise.

[format]
# Keep one-line `:= rfl` proofs readable as one-line claims.
declaration-body = "same-line"

[lint]
# Import order may affect initialization; keep the proof ladder's order.
ignore = ["FMT005"]

# Root modules enumerate every member as a completeness check.
per-file-ignores = { "Theorems.lean" = ["FMT004"], "Tests.lean" = ["FMT004"] }
