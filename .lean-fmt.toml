# lean-fmt: formatter and linter, both adopted.
#
# The formatter was declined once, on measurements, and then adopted by decision. The
# measurements are kept because they are what to re-read if it ever looks wrong:
# reformatting cost 66 of 71 files, +8540/-6173 lines, 894 of those inside tactic
# blocks, and ~500 commands it cannot lay out at all and therefore leaves as written.
# That last number is not a bug to fix here — it is why some declarations still look
# hand-laid after a format run.
#
# The deal with a formatter is that you take its style. Two settings below are not
# style disagreements but genuine mismatches worth overriding; everything else is left
# at the default deliberately, including the choices I would have made differently.

[format]
# Its default. NOT 80, even though every docstring in this tree is wrapped to 80:
# measured, at 80 the layout engine fails to validate 680 commands versus ~500 at 100,
# so the narrower margin buys a LESS formatted tree. Code sits at 100, prose stays at
# 80 via reflow-comments below. That asymmetry is chosen, not overlooked.
line-width = 100

# Keeps `theorem foo … := rfl` on one line. The default moves `rfl` to its own line,
# which costs a line on several hundred one-line proofs — and those are load-bearing
# here: `onMsg_screen`'s docstring says "`rfl`, so any smuggled side effect breaks
# it", where the whole point is that the proof is small enough to read at a glance.
declaration-body = "same-line"

# Default, stated because it is load-bearing rather than incidental: the docstrings
# carry most of this repo's reasoning, hand-wrapped, with tables and argument
# structure a rewrapper would flatten. `--` blocks stay exactly as written.
reflow-comments = false

[lint]
# `select` left at the defaults. `select = ["all"]` adds FMT016 (line-width), which is
# `default: off`; on a formatted tree it reports only what the engine could not break
# within the margin, which is a different and much shorter list — worth revisiting now
# that format is on, but not enabled blind.

# FMT005, import ordering — baselined, not fixed. Report-only by design because, in
# lean-fmt's words, "reordering imports can change initialization order in principle".
# On a 1467-theorem library that is real risk for cosmetic gain, and the present order
# is the Render ladder's own rung order, which is how the façade documents itself.
ignore = ["FMT005"]

# FMT004, redundant imports. Eight of eleven were in the two ROOT modules, and there
# the redundancy IS the invariant: `lakefile.lean` says "Root module imports every
# Theorems.X — a proof file not imported there is a bug", so the root lists all of
# them as a completeness check even though most arrive transitively. The rule cannot
# know that; this is where it is told. The other three were genuine and removed.
per-file-ignores = { "Theorems.lean" = ["FMT004"], "Tests.lean" = ["FMT004"] }
